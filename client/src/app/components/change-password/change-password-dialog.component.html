<div class="popup-overlay">
  <div class="popup popup--sm" role="dialog" aria-modal="true" aria-labelledby="change-password-title" appClickOutside (appClickOutside)="close()">
    <header class="popup__head">
      <div>
        <h2 id="change-password-title" class="popup__title">{{ 'changePassword.title' | translate }}</h2>
      </div>
      <button type="button" class="popup__close" (click)="close()" [attr.aria-label]="'common.close' | translate">
        <svg viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <form class="popup__body" (ngSubmit)="save()">
      @if (error()) {
        <div class="alert alert--danger" role="alert"><span>{{ error() }}</span></div>
      }
      <div class="field">
        <label class="field__label" for="cp-current">{{ 'changePassword.current' | translate }}</label>
        <input id="cp-current" name="current" class="input input--full" type="password" autocomplete="current-password"
               [ngModel]="current()" (ngModelChange)="current.set($event)" [disabled]="isSaving()" />
      </div>
      <div class="field">
        <label class="field__label" for="cp-next">{{ 'changePassword.next' | translate }}</label>
        <input id="cp-next" name="next" class="input input--full" type="password" autocomplete="new-password"
               [placeholder]="'changePassword.nextHint' | translate : { count: minimumLength }"
               [ngModel]="next()" (ngModelChange)="next.set($event)" [disabled]="isSaving()" />
      </div>
      <div class="field">
        <label class="field__label" for="cp-confirm">{{ 'changePassword.confirm' | translate }}</label>
        <input id="cp-confirm" name="confirm" class="input input--full" type="password" autocomplete="new-password"
               [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" [disabled]="isSaving()" />
        @if (mismatch()) {
          <p class="hint hint--error">{{ 'changePassword.mismatch' | translate }}</p>
        }
      </div>
      <p class="hint">{{ 'changePassword.otherDevices' | translate }}</p>
      <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
    </form>
    <footer class="popup__foot">
      <button class="btn" (click)="close()" [disabled]="isSaving()">{{ 'common.cancel' | translate }}</button>
      <button class="btn btn--primary" (click)="save()" [disabled]="!canSave()" [appLoadingButton]="isSaving()">
        {{ 'changePassword.save' | translate }}
      </button>
    </footer>
  </div>
</div>
